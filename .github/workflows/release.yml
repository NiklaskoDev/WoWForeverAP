name: Release

# Runs when a version tag is pushed: vMAJOR.MINOR.HOTFIX or vMAJOR.MINOR.HOTFIX-prN
# Pushing the tag IS the release decision - only the programmer (or the AI on
# explicit instruction) pushes tags. See docs/ai/versioning.md.
# A workflow_dispatch run is a dry run: it tests, builds and verifies, and never publishes.
# The same steps run locally with scripts/release_dry_run.sh.

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-pr[0-9]+'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  # Runs repository code with a read-only token; the files go to publish as a workflow artifact.
  build:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      version: ${{ steps.tag.outputs.version }}
      prerelease: ${{ steps.tag.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Check tag against VERSION
        id: tag
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$EVENT" = workflow_dispatch ]; then
            TAG="v$(tr -d '[:space:]' < VERSION)"
          else
            TAG="$REF_NAME"
          fi
          python tools/release_check.py tag "$TAG" >> "$GITHUB_OUTPUT"

      - name: Build
        run: python tools/build.py

      - name: Verify artifacts
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: python tools/release_check.py verify "$VERSION"

      - name: Release notes
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: python tools/release_check.py notes "$VERSION"

      - name: Upload release files
        uses: actions/upload-artifact@v7
        with:
          name: release-files
          path: dist/
          if-no-files-found: error
          retention-days: 7

  # The only job with a write token. It checks out and runs no repository code.
  publish:
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download release files
        uses: actions/download-artifact@v8
        with:
          name: release-files
          path: release

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.build.outputs.version }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
        run: |
          ARGS=(--verify-tag --title "$TAG")
          if [ "$PRERELEASE" = "true" ]; then ARGS+=(--prerelease); fi
          if grep -q '[^[:space:]]' release/notes.md; then
            ARGS+=(--notes-file release/notes.md)
          else
            ARGS+=(--generate-notes)
          fi
          gh release create "$TAG" "${ARGS[@]}" \
            release/wow_forever.apworld \
            "release/WoWForeverAP-$VERSION.zip" \
            release/SHA256SUMS
